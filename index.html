<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f1fbf6">
    <title>Kelias</title>
    <!-- PWA: "Add to Home screen" opens the app without browser bars (Android and iPhone). -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kelias">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f1fbf6; }
      body { display: flex; align-items: center; justify-content: center; touch-action: none; }
      /* Phone-shaped portrait frame on desktop; full window on phones. */
      #frame { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; box-shadow: 0 0 24px rgba(0, 0, 0, 0.12); }
      #frame.mobile { width: 100%; height: 100%; aspect-ratio: auto; box-shadow: none; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #f1fbf6; outline: none; }
      #loading { position: absolute; left: 20%; right: 20%; top: 50%; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.1); overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #2e9e6b; transition: width 0.2s; }
      #banner { position: absolute; left: 0; right: 0; top: 0; font: 14px sans-serif; }
      /* Desktop: bottom right of the window, outside the phone frame. */
      #fullscreen { position: fixed; right: 16px; bottom: 16px; width: 44px; height: 44px; padding: 0; border: none; border-radius: 22px;
                    background: #0f5a43; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
      #fullscreen[hidden] { display: none; }
      /* Phones: small and translucent at the top centre, the empty middle of the app's title bar. */
      #frame.mobile ~ #fullscreen { right: auto; bottom: auto; left: 50%; top: 10px; margin-left: -18px; width: 36px; height: 36px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div id="loading-fill"></div></div>
      <div id="banner"></div>
    </div>
    <button id="fullscreen" type="button" aria-label="Fullscreen" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
    <script>
      var frame = document.querySelector("#frame");
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) frame.className = "mobile";

      // Fullscreen button. Browsers allow fullscreen only from a user gesture, hence a button.
      // Hidden where page fullscreen does not exist (iPhone Safari) and when launched from the
      // home screen (the manifest already opens it without browser bars).
      var root = document.documentElement;
      var requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
      var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
      var installed = matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone;
      var fullscreenButton = document.querySelector("#fullscreen");
      function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function updateFullscreenButton() {
        // Phones leave fullscreen with the system Back gesture, so the button only enters it there.
        fullscreenButton.hidden = !requestFullscreen || installed || (isMobile && isFullscreen());
      }
      fullscreenButton.addEventListener("click", function () {
        if (isFullscreen()) { exitFullscreen.call(document); return; }
        var result = requestFullscreen.call(root, { navigationUI: "hide" });
        if (isMobile && result && result.then) {
          result.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {});
          }).catch(function () {});
        }
      });
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
      updateFullscreenButton();

      function showBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "10px";
        div.style.background = type == "error" ? "#f88" : "#ffd";
        document.querySelector("#banner").appendChild(div);
        if (type != "error") setTimeout(function () { div.remove(); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/19870d5b7879b40f2e80c0e2414aade1.data.unityweb",
        frameworkUrl: buildUrl + "/152a1abdade619fc25d79132703e77ca.framework.js.unityweb",
        codeUrl: buildUrl + "/320375d97f784bf9b0d41123343d72e8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Dialogo Studija",
        productName: "Kelias",
        productVersion: "0.1.5",
        showBanner: showBanner,
        // Progress (progress.json in persistentDataPath) must survive a page reload.
        autoSyncPersistentDataPath: true,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/5cdc6133ed5c2659ea003d035aa30fda.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").remove();
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
